<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carpentry Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="alternate icon" href="assets/images/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background-color: #ffffff;
      }
      body {
        padding: 60px 20px 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 16px;
        line-height: 1.5;
        color: #24292f;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .content {
        word-wrap: break-word;
      }
      .content h1,
      .content h2,
      .content h3,
      .content h4,
      .content h5,
      .content h6 {
        margin-top: 32px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
        color: #24292f;
      }
      .content h1 {
        font-size: 2em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid #d0d7de;
        margin-top: 0;
      }
      .content h2 {
        font-size: 1.5em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid #d0d7de;
        margin-top: 48px;
      }
      .content h3 {
        font-size: 1.25em;
      }
      .content h4 {
        font-size: 1em;
      }
      .content p {
        margin-bottom: 16px;
        margin-top: 0;
      }
      .content ul,
      .content ol {
        margin-top: 0;
        margin-bottom: 16px;
        padding-left: 2em;
      }
      .content li {
        margin-bottom: 0.25em;
      }
      .content img {
        max-width: 100%;
        height: auto;
        margin: 0;
        box-sizing: content-box;
        background-color: #ffffff;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .content img:hover {
        opacity: 0.8;
      }
      .content a {
        color: #0969da;
        text-decoration: none;
      }
      .content a:hover {
        text-decoration: underline;
      }
      .content strong {
        font-weight: 600;
      }
      .content em {
        font-style: italic;
      }
      .image-lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 4000;
        cursor: pointer;
      }
      .image-lightbox-overlay.active {
        display: flex;
      }
      .image-lightbox-content {
        max-width: 90vw;
        max-height: 90vh;
        position: relative;
      }
      .image-lightbox-content img {
        max-width: 100%;
        max-height: 90vh;
        width: auto;
        height: auto;
        object-fit: contain;
        cursor: default;
      }
      .image-lightbox-close {
        position: absolute;
        top: -40px;
        right: 0;
        color: #ffffff;
        font-size: 32px;
        cursor: pointer;
        background: none;
        border: none;
        line-height: 1;
        padding: 0;
        width: 32px;
        height: 32px;
      }
      .image-lightbox-close:hover {
        opacity: 0.7;
      }
      @media (max-width: 768px) {
        body {
          padding: 40px 16px 20px 16px;
        }
        .content h1 {
          font-size: 1.75em;
        }
        .content h2 {
          font-size: 1.35em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content" id="content"></div>
    </div>

    <!-- Image Lightbox -->
    <div class="image-lightbox-overlay" id="imageLightboxOverlay">
      <div class="image-lightbox-content">
        <button class="image-lightbox-close" id="imageLightboxClose">×</button>
        <img id="lightboxImage" src="" alt="" />
      </div>
    </div>

    <script>
      // Configure marked.js
      if (typeof marked !== 'undefined') {
        try {
          if (marked.use) {
            marked.use({
              breaks: true,
              gfm: true,
              headerIds: false,
              mangle: false
            });
          } else if (marked.setOptions) {
            marked.setOptions({
              breaks: true,
              gfm: true,
              headerIds: false,
              mangle: false
            });
          }
        } catch (e) {
          console.log('marked.js config error:', e);
        }
      }

      // Load and render carpentry markdown
      fetch('projects/carpentry-av.md')
        .then(response => {
          if (!response.ok) {
            throw new Error('File not found');
          }
          return response.text();
        })
        .then(markdown => {
          if (typeof marked !== 'undefined') {
            let html = marked.parse(markdown);
            // Unescape HTML if needed
            html = html.replace(/&lt;img/g, '<img')
                       .replace(/&lt;\/img&gt;/g, '</img>')
                       .replace(/&lt;div/g, '<div')
                       .replace(/&lt;\/div&gt;/g, '</div>')
                       .replace(/&quot;/g, '"')
                       .replace(/&gt;/g, '>');
            document.getElementById('content').innerHTML = html;
            
            // Add click handlers to all images for lightbox
            const images = document.querySelectorAll('.content img');
            images.forEach(img => {
              img.addEventListener('click', function(e) {
                e.stopPropagation();
                openImageLightbox(this.src, this.alt);
              });
            });
          } else {
            document.getElementById('content').innerHTML = '<pre>' + markdown + '</pre>';
          }
        })
        .catch(error => {
          document.getElementById('content').innerHTML = '<p>Content not available.</p>';
          console.error('Error loading markdown:', error);
        });

      // Image Lightbox Functions
      const imageLightboxOverlay = document.getElementById('imageLightboxOverlay');
      const lightboxImage = document.getElementById('lightboxImage');
      const imageLightboxClose = document.getElementById('imageLightboxClose');

      function openImageLightbox(src, alt) {
        lightboxImage.src = src;
        lightboxImage.alt = alt || '';
        imageLightboxOverlay.classList.add('active');
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
      }

      function closeImageLightbox() {
        imageLightboxOverlay.classList.remove('active');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }

      if (imageLightboxClose) {
        imageLightboxClose.addEventListener('click', (e) => {
          e.stopPropagation();
          closeImageLightbox();
        });
      }

      if (imageLightboxOverlay) {
        imageLightboxOverlay.addEventListener('click', (e) => {
          if (e.target === imageLightboxOverlay) {
            closeImageLightbox();
          }
        });
      }

      // Close on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && imageLightboxOverlay.classList.contains('active')) {
          closeImageLightbox();
        }
      });
    </script>
  </body>
</html>
